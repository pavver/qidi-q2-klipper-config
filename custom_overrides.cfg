# =====================================================================
# custom_overrides.cfg - personal tweaks on top of the stock QIDI config
# =====================================================================
# Tested on firmware: QD_Q2_01.01.03.02 (SOC build 01.01.03.02_20261023)
#
# How it works: this file is included at the END of printer.cfg.
# In Klipper a section defined later overrides options of the same
# section defined earlier, and a gcode_macro defined later replaces the
# stock one. Stock files stay untouched, so QIDI's own macros (T0-T15,
# TRY_INTO_EXTRUDER, box485, ...) keep working.
#
# QIDI Box: every change that matters for multi-color printing checks
# `enable_box` and falls back to stock behavior when the Box is enabled.
#
# !!! After a firmware update !!!
# PRINT_START, CLEAR_NOZZLE, PRINT_END and G29 below are FULL COPIES of
# the stock macros from 01.01.03.02 with small edits marked [custom].
# If QIDI changes these macros in a newer firmware, this file will hide
# their changes. Compare the new stock gcode_macro.cfg with
# stock/01.01.03.02/ in the repository before re-enabling this file.
# =====================================================================

# ---------------------------------------------------------------------
# Motion limits
# ---------------------------------------------------------------------
[printer]
# Stock: 20000 (theoretical). Keep at or below the "suggested max_accel"
# reported by SHAPER_CALIBRATE for both axes.
max_accel: 6000

# ---------------------------------------------------------------------
# Faster leveling (stock: speed 150/100, horizontal_move_z 5, lift_speed 5)
# ---------------------------------------------------------------------
[z_tilt]
speed: 250
horizontal_move_z: 3

[bed_mesh]
speed: 250
horizontal_move_z: 3

[probe_air]
lift_speed: 10

# ---------------------------------------------------------------------
# Bed screw tramming assistant (SCREWS_TILT_CALCULATE)
# ---------------------------------------------------------------------
[screws_tilt_adjust]
screw1: 30, 30
screw1_name: Front left (Base)
screw2: 240, 30
screw2_name: Front right
screw3: 240, 240
screw3_name: Rear right
screw4: 30, 240
screw4_name: Rear left
horizontal_move_z: 3
speed: 250
screw_thread: CW-M4

# ---------------------------------------------------------------------
# M204: clamp to [printer] max_accel. Stock macros and slicers ask for
# up to 10000 mm/s^2; Klipper's M204 would accept that above max_accel.
# Also fixes stock crash on `M204 P<n>` without T and on plain `M204`.
# ---------------------------------------------------------------------
[gcode_macro M204]
rename_existing: M99204
gcode:
    {% set max_a = printer.configfile.settings.printer.max_accel|float %}
    {% if params.S is defined %}
        {% set s = params.S|float %}
    {% elif params.P is defined and params.T is defined %}
        {% set s = [params.P|float, params.T|float]|min %}
    {% elif params.P is defined %}
        {% set s = params.P|float %}
    {% elif params.T is defined %}
        {% set s = params.T|float %}
    {% else %}
        {% set s = 0 %}
    {% endif %}
    {% if s > 0 %}
        {% set s = [s, max_a]|min %}
        SET_VELOCITY_LIMIT ACCEL={s} ACCEL_TO_DECEL={s/2}
    {% endif %}

# ---------------------------------------------------------------------
# PRINT_START - stock copy, edits marked [custom]
# ---------------------------------------------------------------------
[gcode_macro PRINT_START]
gcode:
    SET_PRINT_MAIN_STATUS MAIN_STATUS=print_start
    AUTOTUNE_SHAPERS
    DISABLE_ALL_SENSOR
    CLEAR_PAUSE
    
    {% set bedtemp = params.get('BED') | int %}
    {% set hotendtemp = params.get('HOTEND') | int %}
    {% set chambertemp = params.get('CHAMBER', 0) | int %}
    {% set extruder = params.EXTRUDER|default(0)|int %}
    {% set Polar_cooler = printer.save_variables.variables.enable_polar_cooler|default(0) %}

    M104 S0
    {% if chambertemp == 0 %}
        M106 P3 S255
    {% endif %}
    M140 S{bedtemp}    
    SET_PRINT_SUB_STATUS SUB_STATUS=tool_head_reset
    G28   
    M141 S{chambertemp}    
    SET_GCODE_OFFSET Z=0 MOVE=0
    BUFFER_MONITORING ENABLE=0
    SET_PRINT_SUB_STATUS SUB_STATUS=change_filament
    {% if printer.save_variables.variables.box_count >= 1 and printer["box_extras"] %} 
        SAVE_VARIABLE VARIABLE=load_retry_num VALUE=0
        SAVE_VARIABLE VARIABLE=retry_step VALUE=None
        CLEAR_TOOLCHANGE_STATE
        {% for i in range(16) %}
            SAVE_VARIABLE VARIABLE=runout_{i} VALUE=0
            G4 P100
        {% endfor %}
        {% if printer.save_variables.variables.enable_box == 1 %}
            BOX_PRINT_START EXTRUDER={extruder} HOTENDTEMP={hotendtemp}
            M400
            SET_PRINT_SUB_STATUS SUB_STATUS=flush_filament
            EXTRUSION_AND_FLUSH HOTEND={hotendtemp}
        {% endif %}
    {% endif %}
    SET_PRINT_SUB_STATUS SUB_STATUS=clear_nozzle
    CLEAR_NOZZLE HOTEND={hotendtemp}
    #切料调平
    # [custom] Cut filament before leveling only when QIDI Box is enabled.
    # Without Box the cut stub just stays in the extruder and wears the blade.
    {% if printer.save_variables.variables.enable_box|default(0) == 1 %}
        CUT_FILAMENT_1
    {% endif %}
    M104 S140
    G4 P3000
    M400
    G28    
    SET_PRINT_SUB_STATUS SUB_STATUS=z_tilt_adjust
    Z_TILT_ADJUST
    

    M104 S140
    SET_PRINT_SUB_STATUS SUB_STATUS=wait_bed_temp
    M190 S{bedtemp}   
    SET_PRINT_SUB_STATUS SUB_STATUS=wait_chamber_temp
    M191 S{chambertemp}
    M400
    # G4 P3000    # [custom] removed: M190/M191 above already wait for temperatures
    SET_PRINT_SUB_STATUS SUB_STATUS=auto_bed_adjust
    G29
    G0 Z50 F600
    G0 X260 Y5  F30000
    {% if printer.save_variables.variables.box_count >= 1 and printer["box_extras"] and printer.save_variables.variables.enable_box == 1 %}
        BUFFER_MONITORING ENABLE=1 
    {% endif %}
    M191 S{chambertemp}
    M109 S{hotendtemp}
    M204 S10000
    M106 P4 S{Polar_cooler}                    #根据设置开启空调

    set_zoffset
    ENABLE_ALL_SENSOR
    save_last_file
    SET_PRINT_MAIN_STATUS MAIN_STATUS=printing

# ---------------------------------------------------------------------
# CLEAR_NOZZLE - stock copy, edits marked [custom]
# ---------------------------------------------------------------------
[gcode_macro CLEAR_NOZZLE]
gcode:
    {% set hotendtemp = params.HOTEND|default(250)|int %}
    MOVE_TO_TRASH
    M400
    M109 S{hotendtemp}
#    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hotendtemp-20}
    # [custom] Purge into the chute only when QIDI Box is enabled.
    # Single-spool printing: no purge, the slicer's purge line primes the nozzle.
    {% if printer.save_variables.variables.enable_box|default(0) == 1 %}
        G92 E0
        G1 E5 F80
        G92 E0
        G1 E80 F300
        G92 E0
        G1 E-2 F200
    {% endif %}
    M400
    M106 S255
    G4 P1000
    M104 S140
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={hotendtemp-30}

    M204 S5000
        G1 X103 F5000
        G1 X90 F5000
        G1 X103 F5000
        G1 X90 F5000
        G1 X103 F5000
        G1 X90 F5000
        G1 X103 F5000
        G1 X90 F5000
        G1 X103 F5000
        G1 X90 F5000

        G1 X114 F5000
        G1 X100 F5000
        G1 X114 F5000
        G1 X100 F5000
        G1 X114 F5000
        G1 X100 F5000
        G1 X114 F5000
        G1 X100 F5000
        G1 X114 F5000
        G1 X100 F5000
        G1 X114 F5000
        G1 X100 F5000
        G1 X114 F5000
        G1 X100 F5000

        G1 X103 F5000
        G1 X90 F5000
        G1 X103 F5000
        G1 X90 F5000
        G1 X103 F5000
        G1 X90 F5000
        G1 X103 F5000
        G1 X90 F5000
        G1 X103 F5000
        G1 X90 F5000

    
    G1 X125 F15000
    
    G1 X130 Y280 F6000
    G1 Z-0.2 F600

    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=150
    M106 S255
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G1 X140 F200
    G1 Y281 F200
    G1 X130 F200
    G1 Y283 F200
    G1 X140 F200

    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 Z0.2
    G1 X180 F12000
    G1 Z-1.5
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    M400
    M118 Nozzle cleared
    G1 Z30 F900
    G1 Y10 F18000
    G1 X260 F18000
    M106 S0

# ---------------------------------------------------------------------
# PRINT_END - stock copy, edits marked [custom]
# ---------------------------------------------------------------------
[gcode_macro PRINT_END]
gcode:
    M400
    save_zoffset
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    CLEAR_PAUSE
    M106 P2 S0
    M106 P0 S0
    M106 P4 S0                                                     # 关闭空调
    # M106 P3 S0
    DISABLE_BOX_HEATER
    
    M104 S0
    M140 S0
    M141 S0

    M220 S100
    M221 S100
    M84
	
    DISABLE_ALL_SENSOR
    {% if printer.save_variables.variables.box_count >= 1 and printer.save_variables.variables.enable_box == 1 and printer["box_extras"]%}
        BUFFER_MONITORING ENABLE=0
    {% endif %}
#    SET_GCODE_OFFSET Z=0 MOVE=0
    BED_MESH_CLEAR
    G31
    CLEAR_LAST_FILE
    BEEP I=3 DUR=200    # [custom] 3 short beeps when the print is done
    # SDCARD_RESET_FILE
    SET_PRINT_MAIN_STATUS MAIN_STATUS=ready

# ---------------------------------------------------------------------
# G29 - stock copy, edits marked [custom]
# ---------------------------------------------------------------------
[gcode_macro G29]
variable_k:1
gcode:
    BED_MESH_CLEAR
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
    {% if k|int==1 %}
        _CG28    # [custom] skip homing if already homed
        BED_MESH_CALIBRATE PROFILE=kamp       
        SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
        # G4 P5000    # [custom] removed
        SAVE_CONFIG_QD 
    {% else %}
        {% if printer["bed_mesh"].profiles.default %}
            _CG28    # [custom] skip homing if already homed
            BED_MESH_PROFILE LOAD=default
            SAVE_VARIABLE VARIABLE=profile_name VALUE='"default"'
        {% else %}
            _CG28    # [custom] skip homing if already homed
            BED_MESH_CALIBRATE PROFILE=default
            SAVE_VARIABLE VARIABLE=profile_name VALUE='"default"'
            # G4 P5000    # [custom] removed
            SAVE_CONFIG_QD
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------------
# SCREWS_TILT_CALCULATE with Ukrainian hints
# ---------------------------------------------------------------------
[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: _SCREWS_TILT_CALCULATE_BASE
description: Асистент регулювання гвинтів столу з підказками українською
gcode:
    _CG28
    M118 --------------------------------------------------
    M118 🧭 АСИСТЕНТ РЕГУЛЮВАННЯ ГВИНТІВ СТОЛУ:
    M118 • CW  = Крутити ЗА годинниковою стрілкою (праворуч ↻)
    M118 • CCW = Крутити ПРОТИ годинникової стрілки (ліворуч ↺)
    M118 • 00:15 = 1/4 оберту (15 хвилин)
    M118 • 00:30 = 1/2 оберту (30 хвилин)
    M118 • Front left — базовий гвинт (Base), підганяйте інші під нього!
    M118 --------------------------------------------------
    _SCREWS_TILT_CALCULATE_BASE {rawparams}
    M118 --------------------------------------------------
    M118 Підкрутіть гвинти за підказками та повторіть, поки різниця не стане < 00:05!
    M118 --------------------------------------------------
